# Vue Router "history" modu kullaniyor (yani /musteri/3 gibi adresler).
# Normalde nginx bu adres icin gercekten "musteri/3" diye bir dosya arar,
# bulamayinca 404 verir. try_files ile "boyle bir dosya yoksa index.html'i
# don, Vue Router adresi kendisi cozsun" diyoruz.

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
